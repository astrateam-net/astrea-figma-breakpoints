min_version = "2026.10.23"
redactions = ["*_TOKEN", "*_SECRET*", "*PASSWORD*", "*_KEY", "*_KEY_ID"]

[settings]
lockfile = true

[tools]
bun = "1.3.1"
node = "24.22.1"
hk = "2.10.0"
pkl = "0.33.0"

[env]
HK_MISE = 1 # run hk hooks via `mise x` so pinned tools resolve without shell activation

[hooks]
postinstall = "hk install --mise"
